<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CORONA - Agricultural Fire Fighting Robot</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#07110b;
    color:white;
}

#app{
    width:100vw;
    height:100vh;
    position:relative;
}

#canvas-container{
    position:absolute;
    inset:0;
}

canvas{
    display:block;
}

.interface{
    position:absolute;
    top:20px;
    left:20px;
    z-index:10;
    background:rgba(5,15,9,.82);
    backdrop-filter:blur(12px);
    border:1px solid rgba(90,255,140,.3);
    border-radius:16px;
    padding:18px;
    width:300px;
    box-shadow:0 15px 40px rgba(0,0,0,.45);
}

.title{
    font-size:24px;
    font-weight:800;
    color:#75ff9c;
    margin-bottom:4px;
}

.subtitle{
    font-size:12px;
    opacity:.7;
    margin-bottom:15px;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    margin-bottom:15px;
}

.status-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#35ff70;
    box-shadow:0 0 15px #35ff70;
}

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.info-box{
    background:rgba(255,255,255,.06);
    border-radius:10px;
    padding:10px;
}

.info-box small{
    display:block;
    opacity:.55;
    font-size:10px;
    margin-bottom:4px;
}

.info-box strong{
    font-size:13px;
}

.controls{
    position:absolute;
    bottom:20px;
    left:20px;
    z-index:10;
    background:rgba(5,15,9,.8);
    border:1px solid rgba(90,255,140,.25);
    border-radius:14px;
    padding:12px;
}

.controls-title{
    font-size:12px;
    margin-bottom:8px;
    opacity:.7;
}

.keys{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.key{
    min-width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#17261b;
    border:1px solid #3c6045;
    border-radius:7px;
    font-size:12px;
    font-weight:bold;
}

.buttons{
    position:absolute;
    right:20px;
    bottom:20px;
    z-index:10;
    display:flex;
    gap:8px;
}

button{
    border:1px solid rgba(100,255,150,.35);
    background:rgba(8,25,13,.9);
    color:white;
    padding:11px 15px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#173d22;
}

.fire-status{
    margin-top:12px;
    padding:10px;
    border-radius:9px;
    background:rgba(255,70,30,.12);
    border:1px solid rgba(255,80,40,.25);
    color:#ff9c82;
    font-size:11px;
}

#loading{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#07110b;
    z-index:100;
    font-weight:bold;
}

@media(max-width:700px){
    .interface{
        width:250px;
        top:10px;
        left:10px;
        padding:13px;
    }

    .title{
        font-size:19px;
    }

    .controls{
        bottom:10px;
        left:10px;
    }

    .buttons{
        right:10px;
        bottom:10px;
    }
}
</style>
</head>

<body>

<div id="app">

<div id="loading">
    MEMUAT SISTEM CORONA...
</div>

<div id="canvas-container"></div>

<div class="interface">

    <div class="title">
        CORONA
    </div>

    <div class="subtitle">
        Cybernetic Observation and Remote Solar-Powered Network for Agricultural Fire Mitigation
    </div>

    <div class="status">
        <span class="status-dot"></span>
        SISTEM ONLINE
    </div>

    <div class="info">

        <div class="info-box">
            <small>MODE</small>
            <strong>FIRE MITIGATION</strong>
        </div>

        <div class="info-box">
            <small>ENERGI</small>
            <strong id="energy">87%</strong>
        </div>

        <div class="info-box">
            <small>SUHU</small>
            <strong id="temperature">42°C</strong>
        </div>

        <div class="info-box">
            <small>KECEPATAN</small>
            <strong id="speed">0 km/h</strong>
        </div>

    </div>

    <div class="fire-status">
        🔥 SENSOR KEBAKARAN AKTIF<br>
        Pemantauan area pertanian sedang berlangsung
    </div>

</div>

<div class="controls">

    <div class="controls-title">
        KONTROL ROBOT
    </div>

    <div class="keys">

        <div class="key">W</div>
        <div class="key">A</div>
        <div class="key">S</div>
        <div class="key">D</div>

        <div class="key">Q</div>
        <div class="key">E</div>

    </div>

</div>

<div class="buttons">

    <button id="autoBtn">
        🔄 Auto Rotate
    </button>

    <button id="resetBtn">
        ↺ Reset
    </button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;

let corona;

let wheels=[];

let cameraHead;
let waterCannon;

let autoRotate=true;

let mouseDown=false;
let lastX=0;
let lastY=0;

let orbitX=0;
let orbitY=.35;

let distance=16;

let keys={};

let fireParticles=[];
let smokeParticles=[];

let clock=new THREE.Clock();


/* ================================
   SCENE
================================ */

scene=new THREE.Scene();

scene.background=new THREE.Color(0x07110b);

scene.fog=new THREE.Fog(
    0x07110b,
    20,
    70
);


/* ================================
   CAMERA
================================ */

camera=new THREE.PerspectiveCamera(
    50,
    window.innerWidth/window.innerHeight,
    .1,
    200
);


/* ================================
   RENDERER
================================ */

renderer=new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
    THREE.SRGBColorSpace;

document
.getElementById("canvas-container")
.appendChild(renderer.domElement);


/* ================================
   LIGHTING
================================ */

const ambient=
new THREE.HemisphereLight(
    0xb8d8c0,
    0x162018,
    1.4
);

scene.add(ambient);


const sun=
new THREE.DirectionalLight(
    0xffffff,
    2.4
);

sun.position.set(
    -15,
    25,
    12
);

sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

scene.add(sun);


/* ================================
   MATERIALS
================================ */

const bodyMat=
new THREE.MeshStandardMaterial({
    color:0x25352b,
    metalness:.75,
    roughness:.27
});

const darkMat=
new THREE.MeshStandardMaterial({
    color:0x111715,
    metalness:.9,
    roughness:.25
});

const rubberMat=
new THREE.MeshStandardMaterial({
    color:0x090b0a,
    metalness:.1,
    roughness:.95
});

const silverMat=
new THREE.MeshStandardMaterial({
    color:0x87918b,
    metalness:.9,
    roughness:.18
});

const glassMat=
new THREE.MeshPhysicalMaterial({
    color:0x182d31,
    metalness:.25,
    roughness:.08,
    transmission:.1,
    transparent:true,
    opacity:.85
});

const solarMat=
new THREE.MeshStandardMaterial({
    color:0x0b2940,
    metalness:.65,
    roughness:.25
});

const redMat=
new THREE.MeshStandardMaterial({
    color:0x450808,
    emissive:0xff1800,
    emissiveIntensity:2
});

const greenMat=
new THREE.MeshStandardMaterial({
    color:0x063514,
    emissive:0x00ff62,
    emissiveIntensity:2
});

const orangeMat=
new THREE.MeshStandardMaterial({
    color:0x5a1800,
    emissive:0xff5100,
    emissiveIntensity:2
});


/* ================================
   HELPERS
================================ */

function box(
    w,h,d,
    material,
    x=0,
    y=0,
    z=0
){

    const geo=
    new THREE.BoxGeometry(
        w,h,d
    );

    const mesh=
    new THREE.Mesh(
        geo,
        material
    );

    mesh.position.set(
        x,y,z
    );

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    corona.add(mesh);

    return mesh;
}


function cylinder(
    radiusTop,
    radiusBottom,
    height,
    material,
    x=0,
    y=0,
    z=0,
    rotationX=0,
    rotationZ=0
){

    const geo=
    new THREE.CylinderGeometry(
        radiusTop,
        radiusBottom,
        height,
        32
    );

    const mesh=
    new THREE.Mesh(
        geo,
        material
    );

    mesh.position.set(
        x,y,z
    );

    mesh.rotation.x=
        rotationX;

    mesh.rotation.z=
        rotationZ;

    mesh.castShadow=true;

    corona.add(mesh);

    return mesh;
}


/* ================================
   ROBOT GROUP
================================ */

corona=
new THREE.Group();

scene.add(corona);


/* ================================
   MAIN CHASSIS
================================ */

box(
    4.8,
    1.55,
    3.2,
    bodyMat,
    0,
    2.25,
    0
);

box(
    4.5,
    .45,
    2.9,
    darkMat,
    0,
    3.2,
    0
);


/* LOWER ARMOR */

box(
    5.1,
    .65,
    3.35,
    darkMat,
    0,
    1.55,
    0
);


/* FRONT ARMOR */

box(
    4.7,
    1.4,
    .25,
    silverMat,
    0,
    2.25,
    -1.7
);


/* FRONT DARK PANEL */

box(
    3.8,
    .65,
    .08,
    darkMat,
    0,
    2.35,
    -1.86
);


/* ================================
   SENSOR STRIP
================================ */

for(let i=-2;i<=2;i++){

    const sensor=
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .42,
            .16,
            .08
        ),
        i===0 ? orangeMat : greenMat
    );

    sensor.position.set(
        i*.65,
        2.85,
        -1.9
    );

    corona.add(sensor);
}


/* ================================
   SIDE ARMOR
================================ */

for(let side of [-1,1]){

    box(
        .25,
        1.25,
        2.4,
        silverMat,
        side*2.5,
        2.1,
        0
    );

}


/* ================================
   SOLAR PANEL PLATFORM
================================ */

box(
    5.1,
    .18,
    3.3,
    darkMat,
    0,
    3.5,
    0
);


/* SOLAR PANEL */

const panel=
new THREE.Group();

panel.position.y=3.65;

corona.add(panel);


const solar=
new THREE.Mesh(
    new THREE.BoxGeometry(
        4.7,
        .08,
        2.9
    ),
    solarMat
);

solar.castShadow=true;

panel.add(solar);


/* SOLAR GRID */

for(let x=-2;x<=2;x++){

    const line=
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .025,
            .02,
            2.85
        ),
        silverMat
    );

    line.position.x=
        x*.94;

    line.position.y=.06;

    panel.add(line);

}


for(let z=-1;z<=1;z++){

    const line=
    new THREE.Mesh(
        new THREE.BoxGeometry(
            4.65,
            .02,
            .025
        ),
        silverMat
    );

    line.position.z=
        z*.95;

    line.position.y=.06;

    panel.add(line);

}


/* ================================
   CENTRAL MAST
================================ */

cylinder(
    .13,
    .17,
    1.8,
    silverMat,
    0,
    4.55,
    0
);


/* ================================
   CAMERA HEAD
================================ */

cameraHead=
new THREE.Group();

cameraHead.position.set(
    0,
    5.45,
    0
);

corona.add(cameraHead);


const cameraBody=
new THREE.Mesh(
    new THREE.BoxGeometry(
        1.2,
        .65,
        .9
    ),
    darkMat
);

cameraBody.castShadow=true;

cameraHead.add(cameraBody);


/* CAMERA LENS */

const lens=
new THREE.Mesh(
    new THREE.CylinderGeometry(
        .28,
        .28,
        .18,
        32
    ),
    glassMat
);

lens.rotation.x=
Math.PI/2;

lens.position.z=
-.52;

cameraHead.add(lens);


/* CAMERA RING */

const ring=
new THREE.Mesh(
    new THREE.TorusGeometry(
        .28,
        .045,
        16,
        32
    ),
    silverMat
);

ring.rotation.x=
Math.PI/2;

ring.position.z=
-.62;

cameraHead.add(ring);


/* ================================
   THERMAL SENSOR
================================ */

const thermal=
new THREE.Mesh(
    new THREE.SphereGeometry(
        .18,
        20,
        20
    ),
    orangeMat
);

thermal.position.set(
    .48,
    -.05,
    -.52
);

cameraHead.add(thermal);


/* ================================
   WATER CANNON
================================ */

waterCannon=
new THREE.Group();

waterCannon.position.set(
    0,
    3.35,
    -1.95
);

corona.add(waterCannon);


/* BASE */

const cannonBase=
new THREE.Mesh(
    new THREE.CylinderGeometry(
        .48,
        .6,
        .25,
        32
    ),
    darkMat
);

cannonBase.rotation.x=
Math.PI/2;

waterCannon.add(cannonBase);


/* BARREL */

const barrel=
new THREE.Mesh(
    new THREE.CylinderGeometry(
        .22,
        .32,
        2,
        32
    ),
    silverMat
);

barrel.rotation.x=
Math.PI/2;

barrel.position.z=
-.85;

barrel.position.y=
.12;

waterCannon.add(barrel);


/* NOZZLE */

const nozzle=
new THREE.Mesh(
    new THREE.CylinderGeometry(
        .28,
        .2,
        .4,
        32
    ),
    darkMat
);

nozzle.rotation.x=
Math.PI/2;

nozzle.position.z=
-1.95;

nozzle.position.y=
.12;

waterCannon.add(nozzle);


/* ================================
   ANTENNA
================================ */

cylinder(
    .035,
    .05,
    1.3,
    silverMat,
    1.55,
    4.45,
    .5
);

const antennaTip=
new THREE.Mesh(
    new THREE.SphereGeometry(
        .1,
        16,
        16
    ),
    greenMat
);

antennaTip.position.set(
    1.55,
    5.15,
    .5
);

corona.add(antennaTip);


/* ================================
   WARNING LIGHTS
================================ */

const warningLights=[];

for(let side of [-1,1]){

    const light=
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .38,
            .22,
            .2
        ),
        redMat
    );

    light.position.set(
        side*2.05,
        3.1,
        -.65
    );

    corona.add(light);

    warningLights.push(light);
}


/* ================================
   WHEELS
================================ */

function createWheel(
    x,z
){

    const wheelGroup=
    new THREE.Group();

    wheelGroup.position.set(
        x,
        1.2,
        z
    );

    corona.add(
        wheelGroup
    );

    const tire=
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .78,
            .78,
            .48,
            40
        ),
        rubberMat
    );

    tire.rotation.z=
    Math.PI/2;

    tire.castShadow=true;

    wheelGroup.add(tire);


    const rim=
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .42,
            .42,
            .5,
            32
        ),
        silverMat
    );

    rim.rotation.z=
    Math.PI/2;

    wheelGroup.add(rim);


    const hub=
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .17,
            .17,
            .55,
            24
        ),
        darkMat
    );

    hub.rotation.z=
    Math.PI/2;

    wheelGroup.add(hub);


    for(let i=0;i<6;i++){

        const spoke=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .08,
                .32,
                .08
            ),
            darkMat
        );

        spoke.rotation.z=
        i*Math.PI/3;

        spoke.position.x=
        .16*Math.cos(
            i*Math.PI/3
        );

        spoke.position.y=
        .16*Math.sin(
            i*Math.PI/3
        );

        wheelGroup.add(
            spoke
        );

    }

    wheels.push(
        wheelGroup
    );
}


createWheel(-2.55,-1.15);
createWheel( 2.55,-1.15);
createWheel(-2.55, 1.15);
createWheel( 2.55, 1.15);


/* ================================
   GROUND
================================ */

const ground=
new THREE.Mesh(
    new THREE.PlaneGeometry(
        100,
        100
    ),
    new THREE.MeshStandardMaterial({
        color:0x26351f,
        roughness:1
    })
);

ground.rotation.x=
-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* ================================
   FIELD LINES
================================ */

const grid=
new THREE.GridHelper(
    100,
    50,
    0x4b6548,
    0x31412f
);

grid.position.y=.01;

scene.add(grid);


/* ================================
   FARM CROPS
================================ */

const cropMat=
new THREE.MeshStandardMaterial({
    color:0x2d6b2d
});


for(let i=0;i<100;i++){

    const plant=
    new THREE.Group();

    const x=
    (Math.random()-.5)*80;

    const z=
    (Math.random()-.5)*80;

    if(
        Math.abs(x)<8 &&
        Math.abs(z)<8
    ) continue;

    for(let j=0;j<3;j++){

        const leaf=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .06,
                .5,
                .12
            ),
            cropMat
        );

        leaf.position.y=
        .25;

        leaf.rotation.z=
        (Math.random()-.5)*.6;

        leaf.position.x=
        (Math.random()-.5)*.18;

        plant.add(leaf);

    }

    plant.position.set(
        x,
        0,
        z
    );

    scene.add(plant);
}


/* ================================
   FIRE
================================ */

const fireGroup=
new THREE.Group();

fireGroup.position.set(
    8,
    0,
    -5
);

scene.add(fireGroup);


/* FIRE BASE */

const fireLight=
new THREE.PointLight(
    0xff3b00,
    7,
    15
);

fireLight.position.y=
2;

fireGroup.add(
    fireLight
);


for(let i=0;i<35;i++){

    const particle=
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .15+
            Math.random()*.2,
            10,
            10
        ),
        new THREE.MeshBasicMaterial({
            color:
            i%2===0
            ?0xff3b00
            :0xffb000,
            transparent:true,
            opacity:.8
        })
    );

    particle.position.set(
        (Math.random()-.5)*1.5,
        Math.random()*3.5+.2,
        (Math.random()-.5)*1.5
    );

    particle.userData={
        speed:
        .01+
        Math.random()*.03,
        baseY:
        particle.position.y
    };

    fireGroup.add(
        particle
    );

    fireParticles.push(
        particle
    );
}


/* ================================
   SMOKE
================================ */

for(let i=0;i<18;i++){

    const smoke=
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .35+
            Math.random()*.5,
            16,
            16
        ),
        new THREE.MeshStandardMaterial({
            color:0x303030,
            transparent:true,
            opacity:.25
        })
    );

    smoke.position.set(
        (Math.random()-.5)*2,
        3+
        Math.random()*4,
        (Math.random()-.5)*2
    );

    smoke.userData={
        speed:
        .003+
        Math.random()*.008
    };

    fireGroup.add(
        smoke
    );

    smokeParticles.push(
        smoke
    );
}


/* ================================
   MOVEMENT
================================ */

document.addEventListener(
"keydown",
e=>{
    keys[e.key.toLowerCase()]=true;
});


document.addEventListener(
"keyup",
e=>{
    keys[e.key.toLowerCase()]=false;
});


/* ================================
   MOUSE
================================ */

renderer.domElement.addEventListener(
"mousedown",
e=>{
    mouseDown=true;
    lastX=e.clientX;
    lastY=e.clientY;
});


window.addEventListener(
"mouseup",
()=>{
    mouseDown=false;
});


window.addEventListener(
"mousemove",
e=>{

    if(!mouseDown)return;

    const dx=
    e.clientX-lastX;

    const dy=
    e.clientY-lastY;

    orbitX-=dx*.005;

    orbitY-=dy*.005;

    orbitY=
    Math.max(
        -.1,
        Math.min(
            1.2,
            orbitY
        )
    );

    lastX=e.clientX;
    lastY=e.clientY;

});


/* ================================
   TOUCH
================================ */

renderer.domElement.addEventListener(
"touchstart",
e=>{

    if(e.touches.length!==1)return;

    mouseDown=true;

    lastX=
    e.touches[0].clientX;

    lastY=
    e.touches[0].clientY;

});


renderer.domElement.addEventListener(
"touchend",
()=>{
    mouseDown=false;
});


renderer.domElement.addEventListener(
"touchmove",
e=>{

    if(!mouseDown)return;

    const touch=
    e.touches[0];

    const dx=
    touch.clientX-lastX;

    const dy=
    touch.clientY-lastY;

    orbitX-=dx*.005;
    orbitY-=dy*.005;

    orbitY=
    Math.max(
        -.1,
        Math.min(
            1.2,
            orbitY
        )
    );

    lastX=
    touch.clientX;

    lastY=
    touch.clientY;

});


/* ================================
   ZOOM
================================ */

renderer.domElement.addEventListener(
"wheel",
e=>{

    distance+=
    e.deltaY*.01;

    distance=
    Math.max(
        7,
        Math.min(
            30,
            distance
        )
    );

});


/* ================================
   BUTTONS
================================ */

document
.getElementById("autoBtn")
.addEventListener(
"click",
()=>{

    autoRotate=
    !autoRotate;

    document
    .getElementById("autoBtn")
    .textContent=
    autoRotate
    ? "🔄 Auto Rotate"
    : "▶ Manual";

});


document
.getElementById("resetBtn")
.addEventListener(
"click",
()=>{

    corona.position.set(
        0,
        0,
        0
    );

    corona.rotation.set(
        0,
        0,
        0
    );

    orbitX=0;
    orbitY=.35;
    distance=16;

});


/* ================================
   ANIMATION
================================ */

function animate(){

    requestAnimationFrame(
        animate
    );

    const delta=
    clock.getDelta();


    /* AUTO ROTATE */

    if(autoRotate){

        orbitX+=
        delta*.18;

    }


    /* ROBOT MOVEMENT */

    const moveSpeed=
    4*delta;

    const rotateSpeed=
    2.2*delta;


    if(keys["w"]){

        corona.translateZ(
            -moveSpeed
        );

        wheels.forEach(
            w=>{
                w.rotation.x+=
                .18;
            }
        );

    }


    if(keys["s"]){

        corona.translateZ(
            moveSpeed
        );

        wheels.forEach(
            w=>{
                w.rotation.x-=
                .18;
            }
        );

    }


    if(keys["a"]){

        corona.rotation.y+=
        rotateSpeed;

    }


    if(keys["d"]){

        corona.rotation.y-=
        rotateSpeed;

    }


    if(keys["q"]){

        corona.position.y+=
        moveSpeed;

    }


    if(keys["e"]){

        corona.position.y-=
        moveSpeed;

        corona.position.y=
        Math.max(
            0,
            corona.position.y
        );

    }


    /* CAMERA HEAD SCAN */

    cameraHead.rotation.y=
    Math.sin(
        performance.now()*.001
    )*.35;


    /* WATER CANNON */

    waterCannon.rotation.y=
    Math.sin(
        performance.now()*.0008
    )*.25;


    /* WARNING LIGHTS */

    const pulse=
    Math.sin(
        performance.now()*.01
    );

    warningLights.forEach(
        light=>{
            light.material
            .emissiveIntensity=
            pulse>0
            ?4
            :0.7;
        }
    );


    /* FIRE */

    fireParticles.forEach(
        p=>{

            p.position.y+=
            p.userData.speed;

            p.scale.multiplyScalar(
                .99
            );

            if(
                p.position.y>4
            ){

                p.position.y=
                .2+
                Math.random()*1.2;

                p.scale.setScalar(1);

            }

        }
    );


    /* SMOKE */

    smokeParticles.forEach(
        p=>{

            p.position.y+=
            p.userData.speed;

            p.position.x+=
            Math.sin(
                performance.now()*.001+
                p.position.y
            )*.002;

            if(
                p.position.y>8
            ){

                p.position.y=3;

            }

        }
    );


    /* INFO */

    const speed=
    keys["w"]||keys["s"]
    ?12
    :0;

    document
    .getElementById("speed")
    .textContent=
    speed+
    " km/h";


    const temperature=
    42+
    Math.round(
        Math.random()*8
    );

    document
    .getElementById("temperature")
    .textContent=
    temperature+
    "°C";


    /* CAMERA */

    const target=
    new THREE.Vector3(
        corona.position.x,
        corona.position.y+2,
        corona.position.z
    );


    camera.position.x=
    target.x+
    Math.sin(orbitX)*
    Math.cos(orbitY)*
    distance;

    camera.position.z=
    target.z+
    Math.cos(orbitX)*
    Math.cos(orbitY)*
    distance;

    camera.position.y=
    target.y+
    Math.sin(orbitY)*
    distance;


    camera.lookAt(
        target
    );


    renderer.render(
        scene,
        camera
    );

}


/* ================================
   RESIZE
================================ */

window.addEventListener(
"resize",
()=>{

    camera.aspect=
    window.innerWidth/
    window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});


/* ================================
   START
================================ */

setTimeout(
()=>{

    document
    .getElementById("loading")
    .style.display=
    "none";

},
800
);


animate();

</script>

</body>
</html>
